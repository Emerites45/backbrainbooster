spring.application.name=back

# -----------------------------------------------------------------------------
# Configuration Database Neon (PostgreSQL Cloud via .env)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Désactivé pour ne pas chevaucher PostgreSQL localement
spring.docker.compose.enabled=false

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# Sécurité & JWT (via .env)
# -----------------------------------------------------------------------------
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# -----------------------------------------------------------------------------
# Configuration Mails SMTP (via .env)
# -----------------------------------------------------------------------------
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -----------------------------------------------------------------------------
# Configuration SDK API Brevo (via .env)
# -----------------------------------------------------------------------------
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}

# -----------------------------------------------------------------------------
# Configuration Swagger OpenAPI
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html