spring.application.name=back

# -----------------------------------------------------------------------------
# Import du fichier d'environnement (INDISPENSABLE)
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env

# -----------------------------------------------------------------------------
# Base de Données
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Désactivé pour la BDD Cloud Neon ou BDD locale externe
spring.docker.compose.enabled=false

# Configuration Hibernate / JPA
# update : legacy user_app ; tables MCD gérées par Flyway (CREATE IF NOT EXISTS)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway — migrations non destructives
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Sécurité & JWT
# -----------------------------------------------------------------------------
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# -----------------------------------------------------------------------------
# Configuration SMTP Brevo
# -----------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp-relay.brevo.com}

# Email d'expéditeur
MAIL_FROM=${MAIL_FROM}
app.mail.from=${MAIL_FROM}

# -----------------------------------------------------------------------------
# Uploads (ATTACHMENTS)
# -----------------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
